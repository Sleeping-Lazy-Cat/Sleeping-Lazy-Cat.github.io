<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращающиеся изображения</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Большое изображение (основа) -->
        <img src="image.jpg" alt="Большая картинка" class="rotating-image large-image">
        
        <!-- Меньшее изображение (лежит ПОВЕРХ большого) -->
        <img src="image.jpg" alt="Маленькая картинка" class="rotating-image small-image">
    </div>
</body>
</html>
