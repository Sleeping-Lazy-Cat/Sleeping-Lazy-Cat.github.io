<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Большая картинка вращается в одну сторону -->
        <div class="large-box">
            <img src="image.jpg" alt="Большая" class="img">
            
            <!-- Маленькая картинка внутри большой и вращается в ДОМАШНЮЮ сторону -->
            <div class="small-box">
                <img src="image.jpg" alt="Маленькая" class="img">
            </div>
        </div>
    </div>
</body>
</html>
